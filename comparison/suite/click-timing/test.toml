id = "click-timing"
version = 1
category = "input"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[legs]]
id = "rest"
device = "sim:rest"

[[tables]]
section = "input-box-timed"
order = 1
kind = "measure"
label = "Shortest 50 ms click hold"
key = "Timed by"
unit = "ms"
better = "nearer"
layer = "wire"
n = "5 sets of 10 clicks a run, 3 runs"
commands = { stock = "km.click", medius = "CLIP" }
resolution = 0.1

[[tables.rows]]
id = "input-click-onbox-min"
label = "The box"
ptr = ["/results/0/hold/min", "/results/1/hold/min", "/results/2/hold/min", "/results/3/hold/min", "/results/4/hold/min"]
unit = "us"
target = 50

[[tables.rows]]
id = "input-click-host-min"
label = "The PC"
ptr = ["/results/5/hold/min", "/results/6/hold/min", "/results/7/hold/min", "/results/8/hold/min", "/results/9/hold/min"]
unit = "us"
target = 50

[[tables]]
