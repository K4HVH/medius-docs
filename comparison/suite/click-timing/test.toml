[[tables.rows]]
# outcome from stock: /results/10/exact, /results/11/exact, /results/12/exact, /results/13/exact, /results/14/exact; medius: /results/10/exact, /results/11/exact, /results/12/exact, /results/13/exact, /results/14/exact
