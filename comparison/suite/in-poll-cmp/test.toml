[[tables.rows]]
# outcome from stock: /rows/15/match, /rows/16/match, /rows/17/match; medius: /rows/15/match, /rows/16/match, /rows/17/match
id = "pass-polls-hid-8ms"
label = "Vendor-page HID interrupt IN declaring 8 ms"
ptr = "/outcomes/pass-polls-hid-8ms"

[[tables]]
section = "pass-polls"
order = 2
kind = "measure"
label = "Polls while unread"
key = "Endpoint"
unit = "/s"
better = "lower"
n = "2 s before and 2 s after reading, 3 runs"
resolution = 0.1

[[tables.rows]]
id = "pass-polls-vendor-1ms-unread"
label = "Vendor interrupt IN declaring 1 ms"
ptr = ["/rows/0/box", "/rows/2/box"]

[[tables.rows]]
id = "pass-polls-vendor-4ms-unread"
label = "Vendor interrupt IN declaring 4 ms"
ptr = ["/rows/3/box", "/rows/5/box"]

[[tables.rows]]
id = "pass-polls-vendor-8ms-unread"
label = "Vendor interrupt IN declaring 8 ms"
ptr = ["/rows/6/box", "/rows/8/box"]

[[tables.rows]]
id = "pass-polls-hid-1ms-unread"
label = "Vendor-page HID interrupt IN declaring 1 ms"
ptr = ["/rows/9/box", "/rows/11/box"]

[[tables.rows]]
id = "pass-polls-hid-4ms-unread"
label = "Vendor-page HID interrupt IN declaring 4 ms"
ptr = ["/rows/12/box", "/rows/14/box"]

[[tables.rows]]
id = "pass-polls-hid-8ms-unread"
label = "Vendor-page HID interrupt IN declaring 8 ms"
ptr = ["/rows/15/box", "/rows/17/box"]

[[tables]]
section = "pass-polls"
order = 3
kind = "outcome"
label = "First packet after SET_INTERFACE moves a stream"
