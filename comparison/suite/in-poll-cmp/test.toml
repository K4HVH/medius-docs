id = "in-poll-cmp"
version = 1
category = "passthrough"
layout = "native"
boxes = ["stock", "medius"]
jams_stock = false

[[legs]]
id = "vendor-1ms"
device = "sim:vendor-in-1ms"

[[legs]]
id = "vendor-4ms"
device = "sim:vendor-in-4ms"

[[legs]]
id = "vendor-8ms"
device = "sim:vendor-in-8ms"

[[legs]]
id = "hid-1ms"
device = "sim:hid-in-1ms"

[[legs]]
id = "hid-4ms"
device = "sim:hid-in-4ms"

[[legs]]
id = "hid-8ms"
device = "sim:hid-in-8ms"

[[legs]]
id = "move"
device = "sim:move-in"

[[tables]]
section = "pass-polls"
order = 1
kind = "outcome"
label = "Polls while read and while unread"
key = "Endpoint"
outcomes = ["Native polling", "Polled while unread", "Polled at another rate"]

[[tables.rows]]
# outcome from stock: /rows/0/match, /rows/1/match, /rows/2/match; medius: /rows/0/match, /rows/1/match, /rows/2/match
id = "pass-polls-vendor-1ms"
label = "Vendor interrupt IN declaring 1 ms"
ptr = "/outcomes/pass-polls-vendor-1ms"

[[tables.rows]]
# outcome from stock: /rows/3/match, /rows/4/match, /rows/5/match; medius: /rows/3/match, /rows/4/match, /rows/5/match
id = "pass-polls-vendor-4ms"
label = "Vendor interrupt IN declaring 4 ms"
ptr = "/outcomes/pass-polls-vendor-4ms"

[[tables.rows]]
# outcome from stock: /rows/6/match, /rows/7/match, /rows/8/match; medius: /rows/6/match, /rows/7/match, /rows/8/match
id = "pass-polls-vendor-8ms"
label = "Vendor interrupt IN declaring 8 ms"
ptr = "/outcomes/pass-polls-vendor-8ms"

[[tables.rows]]
# outcome from stock: /rows/9/match, /rows/10/match, /rows/11/match; medius: /rows/9/match, /rows/10/match, /rows/11/match
id = "pass-polls-hid-1ms"
label = "Vendor-page HID interrupt IN declaring 1 ms"
ptr = "/outcomes/pass-polls-hid-1ms"

[[tables.rows]]
# outcome from stock: /rows/12/match, /rows/13/match, /rows/14/match; medius: /rows/12/match, /rows/13/match, /rows/14/match
