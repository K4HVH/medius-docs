# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "ep0-stacks"
version = 1
category = "devices"
layout = "native"
boxes = ["stock", "medius"]
jams_stock = false

[[tables]]
section = "devices-ep0-stacks"
order = 1
kind = "measure"
label = "Requests given the native reply"
key = "Device stack"
unit = "requests"
better = "higher"
n = "316 requests per stack, 1 run"

[[tables.rows]]
# pointers differed by box; medius: /base/results/permissive/medius/match
id = "devices-ep0-stack-permissive"
label = "Stack acting on every request as written"
ptr = "/native/results/permissive/stock/match"
of = 316

