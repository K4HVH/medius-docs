# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "stock-intake"
version = 1
category = "control-link"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = true

[[tables]]
section = "link-one-write"
order = 1
kind = "measure"
label = "Counts arriving from one write of moves, binary"
key = "Moves in the write"
unit = "counts"
better = "higher"
layer = "evdev"
n = "One write per row, 2 at 28-29, 1 at 30 (stock's first run stopped at 29)"
commands = { stock = "MOVE (0x18)", medius = "MOVE" }

[[tables.rows]]
id = "link-write-bin-8"
label = "8"
test = "clump-probe"
ptr = "/base/results/0/x_delivered"
of = 8

[[tables.rows]]
id = "link-write-bin-16"
label = "16"
test = "clump-probe"
ptr = "/base/results/1/x_delivered"
of = 16

[[tables.rows]]
id = "link-write-bin-20"
label = "20"
test = "clump-probe"
ptr = "/base/results/2/x_delivered"
of = 20

[[tables.rows]]
id = "link-write-bin-24"
label = "24"
test = "clump-probe"
ptr = "/base/results/3/x_delivered"
of = 24

[[tables.rows]]
# pointers differed by box; medius: /results/1/delivered
id = "link-write-bin-28"
label = "28"
ptr = "/results/0/delivered"
of = 28

[[tables.rows]]
# pointers differed by box; medius: /results/2/delivered
id = "link-write-bin-29"
label = "29"
ptr = "/results/1/delivered"
of = 29

[[tables.rows]]
# pointers differed by box; medius: /results/3/delivered
id = "link-write-bin-30"
label = "30"
ptr = "/results/2/delivered"
