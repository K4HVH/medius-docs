ptr = "/outcomes/devices-imperfect-clone-bulk"

[[tables.rows]]
id = "devices-imperfect-clone-five-in"
label = "Mouse with a vendor interface, five IN endpoints"
ptr = "/outcomes/devices-imperfect-clone-five-in"

[[tables.rows]]
id = "devices-imperfect-clone-six-in"
label = "Mouse with a vendor interface, six IN endpoints"
ptr = "/outcomes/devices-imperfect-clone-six-in"

[[tables.rows]]
id = "devices-imperfect-clone-five-hid"
label = "Keyboard with five HID interfaces, an IN endpoint on each"
ptr = "/outcomes/devices-imperfect-clone-five-hid"

[[tables.rows]]
id = "devices-imperfect-clone-unused-five-in"
label = "Mouse with five IN endpoints in an unused second configuration"
ptr = "/outcomes/devices-imperfect-clone-unused-five-in"

[[tables.rows]]
id = "devices-imperfect-clone-endpoint-7"
label = "Vendor IN numbered 0x87"
ptr = "/outcomes/devices-imperfect-clone-endpoint-7"

[[tables.rows]]
id = "devices-imperfect-clone-wide-packets"
