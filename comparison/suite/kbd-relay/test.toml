# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "kbd-relay"
version = 1
category = "passthrough"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[tables]]
section = "pass-relay"
order = 2
kind = "outcome"
label = "Keyboard reports reaching the PC"
key = "Keyboard"
outcomes = ["All, once, in order", "Repeated or out of order", "Some lost"]

[[tables.rows]]
# outcome from stock: /results/0/dropped, /results/0/duplicated, /results/0/reordered, /results/0/dropped, /results/0/duplicated, /results/0/reordered; medius: /results/0/dropped, /results/0/duplicated, /results/0/reordered, /results/0/dropped, /results/0/duplicated, /results/0/reordered
id = "pass-seq-kbd-1000"
label = "1 kHz keyboard"
