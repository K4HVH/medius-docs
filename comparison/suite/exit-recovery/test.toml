id = "exit-recovery"
version = 1
category = "recovery"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = true

[[legs]]
id = "mouse"
device = "still-mouse"

[[legs]]
id = "keyboard"
device = "still-keyboard"

[[legs]]
id = "clicking"
device = "sim:clicking-mouse"

[[tables]]
section = "recovery-program-exit"
order = 2
kind = "outcome"
label = "Held input 3 s after the program stops, 9 tries"
key = "Case"
commands = { stock = "km.left, km.down, km.lock_mx, km.lock_ml", medius = "INJECT, LOCK" }
outcomes = ["Released", "Still in effect"]

[[tables.rows]]
id = "recovery-exit-button-close"
label = "Left button held, port closed"
ptr = "/outcomes/recovery-exit-button-close"

[[tables.rows]]
id = "recovery-exit-button-silent"
label = "Left button held, program silent"
ptr = "/outcomes/recovery-exit-button-silent"

[[tables.rows]]
id = "recovery-exit-key-close"
label = "Key held, port closed"
ptr = "/outcomes/recovery-exit-key-close"

[[tables.rows]]
id = "recovery-exit-key-silent"
label = "Key held, program silent"
ptr = "/outcomes/recovery-exit-key-silent"

[[tables.rows]]
id = "recovery-exit-lock-x-close"
label = "X axis locked, port closed"
ptr = "/outcomes/recovery-exit-lock-x-close"

[[tables.rows]]
id = "recovery-exit-lock-x-silent"
label = "X axis locked, program silent"
ptr = "/outcomes/recovery-exit-lock-x-silent"

[[tables.rows]]
id = "recovery-exit-lock-left-close"
label = "Left button locked, port closed"
ptr = "/outcomes/recovery-exit-lock-left-close"

[[tables.rows]]
id = "recovery-exit-lock-left-silent"
label = "Left button locked, program silent"
ptr = "/outcomes/recovery-exit-lock-left-silent"
