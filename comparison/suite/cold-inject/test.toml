# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "cold-inject"
version = 1
category = "injection"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[tables]]
section = "inj-fresh-clone"
order = 1
kind = "measure"
label = "Counts arriving within 1 s from three 10-count moves"
key = "Device"
unit = "counts"
better = "higher"
layer = "evdev"
n = "3 tries of 10 counts"
commands = { stock = "km.move_now", medius = "MOVE(NOW)" }

[[tables.rows]]
id = "inj-fresh-never"
label = "No native report yet"
ptr = ["/results/0/move_delivered", "/results/1/move_delivered", "/results/2/move_delivered"]
of = 10

[[tables.rows]]
id = "inj-fresh-every-100"
label = "Native report every 100 ms"
ptr = ["/results/6/move_delivered", "/results/7/move_delivered", "/results/8/move_delivered"]
of = 10

[[tables.rows]]
id = "inj-fresh-once"
label = "One native report at its start"
ptr = ["/results/3/move_delivered", "/results/4/move_delivered", "/results/5/move_delivered"]
of = 10

[[tables]]
section = "inj-fresh-clone"
order = 2
kind = "outcome"
label = "Clicks arriving within 1 s, three tries"
key = "Device"
outcomes = ["All arrive", "Some arrive", "All lost"]

[[tables.rows]]
# outcome from stock: /results/0/click_delivered, /results/1/click_delivered, /results/2/click_delivered; medius: /results/0/click_delivered, /results/1/click_delivered, /results/2/click_delivered
id = "inj-fresh-click-never"
label = "No native report yet"
ptr = "/outcomes/inj-fresh-click-never"

[[tables.rows]]
# outcome from stock: /results/6/click_delivered, /results/7/click_delivered, /results/8/click_delivered; medius: /results/6/click_delivered, /results/7/click_delivered, /results/8/click_delivered
id = "inj-fresh-click-every-100"
label = "Native report every 100 ms"
ptr = "/outcomes/inj-fresh-click-every-100"

[[tables.rows]]
# outcome from stock: /results/3/click_delivered, /results/4/click_delivered, /results/5/click_delivered; medius: /results/3/click_delivered, /results/4/click_delivered, /results/5/click_delivered
id = "inj-fresh-click-once"
label = "One native report at its start"
ptr = "/outcomes/inj-fresh-click-once"
