# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "relay-latency"
version = 1
category = "passthrough"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[tables]]
section = "pass-latency"
order = 1
kind = "measure"
label = "Report latency, p50"
key = "Mouse"
unit = "ms"
better = "lower"
stat = "p50"
layer = "emulator"
n = "2 runs of 24 s"
resolution = 0.01

[[tables.rows]]
id = "pass-latency-p50-1000"
label = "1 kHz mouse"
ptr = "/results/0/latency_us/p50"
unit = "us"

[[tables.rows]]
id = "pass-latency-p50-500"
label = "500 Hz mouse"
ptr = "/results/1/latency_us/p50"
unit = "us"

[[tables.rows]]
