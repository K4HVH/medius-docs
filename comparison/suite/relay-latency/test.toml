label = "250 Hz mouse"
ptr = "/results/2/latency_us/p50"
unit = "us"

[[tables.rows]]
id = "pass-latency-p50-125"
label = "125 Hz mouse"
note = "Stock's clone declares 1 ms, the mouse 8 ms (see Poll interval)"
