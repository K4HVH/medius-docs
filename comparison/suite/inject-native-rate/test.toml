id = "inject-native-rate"
version = 1
category = "passthrough"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[legs]]
id = "count"
device = "sim:count"

[[legs]]
id = "alt"
device = "sim:alt"

[[legs]]
id = "const1"
device = "sim:const1"

[[legs]]
id = "const100"
