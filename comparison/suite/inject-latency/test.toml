# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "inject-latency"
version = 1
category = "injection"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[tables]]
section = "inj-latency"
order = 1
kind = "measure"
label = "Default move latency, p50"
key = "Mouse and move"
unit = "ms"
better = "lower"
stat = "p50"
layer = "wire"
n = "200 moves a run, 2 runs"
commands = { stock = "km.move", medius = "MOVE" }
resolution = 0.01

