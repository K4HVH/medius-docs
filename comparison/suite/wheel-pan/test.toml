[[tables.rows]]
id = "inj-wheel-lat-rest-neg3"
label = "Wheel -3, mouse still"
ptr = "/results/2/latency/p50"
unit = "us"

[[tables.rows]]
id = "inj-wheel-lat-moving-1"
label = "Wheel 1, 1 kHz mouse moving"
ptr = "/results/4/latency/p50"
