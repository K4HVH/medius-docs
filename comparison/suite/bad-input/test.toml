# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "bad-input"
version = 1
category = "control-link"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[tables]]
section = "link-malformed"
order = 1
kind = "outcome"
label = "Valid move after the malformed input"
key = "Malformed input"
commands = { stock = "km.move", medius = "MOVE(NOW)" }
outcomes = ["Arrives", "Lost"]

[[tables.rows]]
# outcome from stock: /results/0/check_arrived; medius: /results/0/check_arrived
id = "link-bad-garbage"
label = "64 KB of random bytes"
ptr = "/outcomes/link-bad-garbage"

[[tables.rows]]
# outcome from stock: /results/1/check_arrived; medius: /results/1/check_arrived
id = "link-bad-cut"
label = "Half a move, the valid move 100 ms later"
