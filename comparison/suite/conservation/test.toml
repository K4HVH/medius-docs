id = "conservation"
version = 1
category = "injection"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[legs]]
id = "idle"
device = "sim:idle_mouse"

[[legs]]
id = "moving_1k"
device = "sim:moving_1k"

[[legs]]
id = "moving_125"
device = "sim:moving_125"

[[legs]]
id = "moving_var"
device = "sim:moving_var"

[[tables]]
section = "inj-totals"
order = 1
kind = "outcome"
label = "Total, default moves"
key = "Mouse and moves"
commands = { stock = "km.move", medius = "MOVE" }
outcomes = ["Exact", "1 count short", "Counts lost", "Counts added"]

[[tables.rows]]
id = "inj-total-rest-spaced"
label = "Still mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-rest-spaced"

[[tables.rows]]
id = "inj-total-rest-1000"
label = "Still mouse, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-rest-1000"

[[tables.rows]]
id = "inj-total-1k-spaced"
label = "Moving 1 kHz mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-1k-spaced"

[[tables.rows]]
id = "inj-total-1k-1000"
label = "Moving 1 kHz mouse, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-1k-1000"

[[tables.rows]]
id = "inj-total-125-spaced"
label = "Moving 125 Hz mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-125-spaced"

[[tables.rows]]
id = "inj-total-125-1000"
label = "Moving 125 Hz mouse, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-125-1000"

[[tables.rows]]
id = "inj-total-var-spaced"
label = "Mouse moving at a varying speed, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-var-spaced"

[[tables.rows]]
id = "inj-total-var-1000"
label = "Mouse moving at a varying speed, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-var-1000"

[[tables]]
section = "inj-totals"
order = 2
kind = "outcome"
label = "Total, immediate moves"
key = "Mouse and moves"
commands = { stock = "km.move_now", medius = "MOVE(NOW)" }
outcomes = ["Exact", "Counts lost", "Counts added"]

[[tables.rows]]
id = "inj-total-now-rest-spaced"
label = "Still mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-now-rest-spaced"

[[tables.rows]]
id = "inj-total-now-rest-1000"
label = "Still mouse, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-now-rest-1000"

[[tables.rows]]
id = "inj-total-now-1k-spaced"
label = "Moving 1 kHz mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-now-1k-spaced"

[[tables.rows]]
id = "inj-total-now-1k-1000"
label = "Moving 1 kHz mouse, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-now-1k-1000"

[[tables.rows]]
id = "inj-total-now-125-spaced"
label = "Moving 125 Hz mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-now-125-spaced"

[[tables.rows]]
id = "inj-total-now-125-1000"
label = "Moving 125 Hz mouse, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-now-125-1000"

[[tables.rows]]
id = "inj-total-now-var-spaced"
label = "Mouse moving at a varying speed, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-total-now-var-spaced"

[[tables.rows]]
id = "inj-total-now-var-1000"
label = "Mouse moving at a varying speed, 2,000 moves at 1,000/s"
ptr = "/outcomes/inj-total-now-var-1000"

[[tables]]
section = "inj-totals"
order = 5
kind = "outcome"
label = "Counts in the wrong direction"
key = "Mouse and moves"
commands = { stock = "km.move", medius = "MOVE" }
outcomes = ["None", "Some"]

[[tables.rows]]
id = "inj-reversed-1k"
label = "Moving 1 kHz mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-reversed-1k"

[[tables.rows]]
id = "inj-reversed-125"
label = "Moving 125 Hz mouse, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-reversed-125"

[[tables.rows]]
id = "inj-reversed-var"
label = "Mouse moving at a varying speed, 400 moves 30-60 ms apart"
ptr = "/outcomes/inj-reversed-var"
