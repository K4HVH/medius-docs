# Seeded from the 2026-11-03 results; legs and pointers are set when the test is ported.
id = "render-shape"
version = 1
category = "injection"
layout = "main"
boxes = ["stock", "medius"]
jams_stock = false

[[tables]]
section = "inj-latency"
order = 7
kind = "measure"
label = "Empty reports while paying out 40 moves, default smoothing"
key = "Counts per move"
unit = "reports"
better = "lower"
layer = "wire"
n = "40 moves, mouse resting"
commands = { stock = "km.move", medius = "MOVE" }
resolution = 1

[[tables.rows]]
# pointers differed by box; medius: /base/cells/12/empty_in_payout
id = "inj-empty-per-move-1"
label = "1 count"
ptr = "/rested/cells/0/empty_in_payout"

[[tables.rows]]
# pointers differed by box; medius: /base/cells/13/empty_in_payout
id = "inj-empty-per-move-10"
label = "10 counts"
ptr = "/rested/cells/1/empty_in_payout"

[[tables.rows]]
# pointers differed by box; medius: /base/cells/14/empty_in_payout
id = "inj-empty-per-move-100"
label = "100 counts"
ptr = "/rested/cells/2/empty_in_payout"

[[tables]]
section = "inj-settings"
order = 1
kind = "settings"
label = "Each smoothing setting"
key = "Setting"
layer = "wire"
n = "40 moves still, 100 moving"
resolution = 0.001

[[tables.columns]]
id = "one"
label = "One count, last count p50"
unit = "ms"
better = "lower"

[[tables.columns]]
id = "hundred"
label = "100 counts, last count p50"
unit = "ms"
better = "lower"

[[tables.columns]]
id = "empty"
label = "Empty reports, 40 one-count moves"
unit = "reports"
better = "lower"

[[tables.columns]]
id = "moving"
label = "One count into a moving mouse, p50"
unit = "ms"
better = "lower"

[[tables.rows]]
id = "inj-setting-interpolation-auto"
label = "Interpolation AUTO"
box = "stock"
default = true
values = { one = { ptr = "/base/cells/0/last/p50", unit = "us" }, hundred = { ptr = "/base/cells/2/last/p50", unit = "us" }, empty = "/base/cells/0/empty_in_payout", moving = { ptr = "/base/cells/5/last/p50", unit = "us" } }

