[[defects]]
id = "devices-stock-report-over-512"
box = "stock"
text = "Report descriptors >512 bytes aren't served, so the PC's HID driver doesn't load for that interface."
rows = ["devices-report-768-2047", "devices-report-513-700", "devices-clone-report-1500"]

[[defects]]
id = "pass-inject-reads"
box = "stock"
text = "While injecting, even at 10 moves/s, stock reads a 1 kHz mouse whose speed varies only about 300-550 times/s ({row:pass-inject-slow-10:stock} of 5,500 reports in 5.5 s at 10 moves/s)."
rows = ["pass-inject-varying", "pass-inject-slow-10", "pass-inject-slow-30", "pass-inject-sine-1000"]

[[defects]]
id = "recovery-exit-held"
box = "stock"
rows = ["recovery-exit-left-button", "recovery-exit-button-close", "recovery-exit-button-silent", "recovery-exit-key-close", "recovery-exit-key-silent", "recovery-exit-lock-x-close", "recovery-exit-lock-x-silent", "recovery-exit-lock-left-close", "recovery-exit-lock-left-silent"]
text = "If a program closes the port or stops sending while a button or key is held or an input locked, it stays in effect until another program releases it or the box restarts (24/24 tries)."

[[defects]]
id = "pass-stock-config-reconnect"
box = "stock"
rows = ["pass-pc-config"]
text = "When the PC switches the clone's configuration, stock reconnects the clone instead of relaying the switch to the real device (3/3 tries). The real device gets 2 bus resets switching to configuration 2 and back."

[[defects]]
id = "link-stock-parser-jam"
box = "stock"
text = "Moves arriving faster than stock takes them (about 30 or more binary moves in one write, ≥10,000 binary moves/s, 8,000 text moves/s, 32 per write every 16 ms, or back to back) are lost, most with no refusal. Every later command then runs one command late until a power cycle. At 8,000 text moves/s some tries end that way and some don't. 30 characters sent as key presses back to back lose characters."
rows = ["link-back-to-back-parser", "link-clump-parser-2000", "link-fast-parser-10000", "link-fast-parser-15000", "link-fast-parser-20000", "link-fast-parser-text-8000", "link-write-parser-29", "link-write-parser-30", "input-typing-pc-pairs"]

[[defects]]
id = "recovery-stock-no-wake"
box = "stock"
text = "Neither an injected move nor the real device's remote wakeup wakes a sleeping PC."
rows = ["recovery-wake-device", "recovery-wake-inject"]

[[defects]]
id = "devices-stock-mouse-interval"
box = "stock"
text = "Mouse clones declare a 1 ms poll interval even when the mouse declares 2-10 ms (a 125 Hz mouse's clone is polled at 1 kHz). Stock's lower latency below 1 kHz comes from this."
rows = ["devices-interval-mouse-8", "devices-interval-mouse-10", "devices-interval-mouse-4", "devices-interval-mouse-2", "devices-clone-mice-slow", "devices-poll-reports-1ms-behind-10ms", "pass-latency-p50-500", "pass-latency-p50-250", "pass-latency-p50-125", "pass-latency-p95-500", "pass-latency-p95-250", "pass-latency-p95-125", "pass-latency-p99-500", "pass-latency-p99-250", "pass-latency-p99-125", "pass-latency-min-500", "pass-latency-min-250", "pass-latency-min-125", "inj-lat-now-125-1", "inj-lat-now-125-50", "inj-lat-now-p95-125-1", "inj-lat-now-p95-125-50", "inj-every-p95-125-1", "inj-every-p95-125-50", "devices-clone-mice-fast", "devices-clone-second-config", "devices-clone-stall", "devices-clone-hsmouse"]

[[defects]]
id = "pass-stock-class-requests-unanswered"
box = "stock"
text = "Requests to the clone sometimes go unanswered: SET_IDLE, SET_PROTOCOL or GET_PROTOCOL in {row:pass-boot-unanswered:stock} tries. While the PC sets the clone up, a descriptor read goes unanswered now and then too, a report descriptor among them, whether the real device answers it or STALLs it. The PC's HID driver waits 5 s before asking again, so the clone comes up late."
rows = ["pass-boot-unanswered"]

[[defects]]
id = "link-stock-moving-refusals"
box = "stock"
text = "With the mouse moving, stock refuses moves past about 1,325/s and replies to each refusal ({row:link-moving-bin-5000:stock} arrived at 5,000/s)."
rows = ["link-moving-bin-5000", "link-moving-bin-1500", "link-moving-bin-2000", "link-moving-bin-3000", "link-moving-text-1500", "link-moving-text-2000", "link-moving-text-3000", "link-moving-text-5000", "link-moving-single-2000", "link-moving-single-5000"]

[[defects]]
id = "inj-stock-raw-move-refused"
box = "stock"
text = "In a stream of RAW_MOVEs whose receipts go unread, stock refuses all but the first few ({row:inj-raw-stream:stock} counts arrive), then every later RAW_MOVE until a power cycle. Ordinary moves are unaffected."
rows = ["inj-raw-stream"]

[[defects]]
id = "pass-stock-pause-skips"
box = "stock"
text = "When the PC pauses reading an interrupt endpoint, stock drops reports the real device would have kept: {row:pass-pause-skip-hid:stock} counter values skipped in a run's 8,000 reports on each endpoint."
rows = ["pass-pause-skip-hid", "pass-pause-skip-vendor"]

[[defects]]
id = "devices-stock-ep0-overrun"
box = "stock"
text = "Where the real device replies past wLength (LUFA, STM32's library, V-USB), stock STALLs the request."
rows = ["devices-ep0-stack-stm32", "devices-ep0-stack-lufa", "devices-ep0-stack-vusb"]

[[defects]]
id = "devices-stock-control-relay"
box = "stock"
text = "Clones have no control endpoint above 0, so every request to one fails. On endpoint 0, stock STALLs reads whose reply is ≥1,024 bytes, a 1,024-byte write, and requests that natively end in an overflow or protocol error. If the real device STALLs a read partway, the PC gets the STALL without the data before it."
rows = ["devices-relay-ep2-reads", "devices-relay-ep2-past-wlength", "devices-relay-ep2-refused", "devices-relay-ep2-paced", "devices-relay-ep2-late", "devices-relay-ep2-never", "devices-relay-ep2-beside", "devices-relay-ep2-abandoned", "devices-relay-ep2-across", "devices-relay-ep2-writes", "devices-relay-ep2-writes-refused", "devices-relay-ep2-writes-paced", "devices-relay-ep2-writes-late", "devices-relay-ep2-writes-never", "devices-relay-ep0-reads", "devices-relay-ep0-past-wlength", "devices-relay-ep0-refused", "devices-relay-ep0-beside", "devices-relay-ep0-writes"]

[[defects]]
id = "pass-stock-unread-polls"
box = "stock"
text = "While the PC reads nothing from an interrupt IN, stock still polls it at its declared rate. Natively, an endpoint the PC doesn't read isn't polled."
rows = ["pass-polls-vendor-1ms", "pass-polls-vendor-4ms", "pass-polls-vendor-8ms", "pass-polls-hid-1ms", "pass-polls-hid-4ms", "pass-polls-hid-8ms", "pass-polls-vendor-1ms-unread", "pass-polls-vendor-4ms-unread", "pass-polls-vendor-8ms-unread", "pass-polls-hid-1ms-unread", "pass-polls-hid-4ms-unread", "pass-polls-hid-8ms-unread"]

[[defects]]
id = "devices-medius-write-refused-partway"
box = "medius"
text = "When the real device STALLs a write partway, the PC reports 0 bytes written, against 64 natively. The clone ACKs each OUT packet before the real device sees it."
rows = ["devices-relay-ep2-writes-refused", "devices-relay-ep0-writes-refused"]

[[defects]]
id = "devices-stock-interfaces-dropped"
box = "stock"
text = "Stock leaves interfaces it can't relay out of the clone's configuration descriptor (the vendor interface holding 5 of a mouse's 6 interrupt INs, an interface with a second control endpoint). On a keyboard with five HID interfaces, the fifth is declared but sends nothing."
rows = ["devices-imperfect-clone-six-in", "devices-imperfect-clone-five-hid", "devices-clone-control-endpoint", "devices-data-six-in", "devices-data-five-hid", "devices-imperfect-data-five-hid"]

[[defects]]
id = "devices-stock-descriptors-rewritten"
box = "stock"
text = "Descriptors are rewritten to fit the box: IN endpoint 0x87 becomes 0x82, and 65- or 1,024-byte packets are declared as 64 bytes."
rows = ["devices-imperfect-clone-endpoint-7", "devices-imperfect-clone-wide-packets"]


